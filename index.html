const allRuns=()=>categories().flatMap(c=>c.runs.map(r=>({...r,category:c.name,group:c.group})));
function isRead(r,i){return !!progress[r.id+'::'+i]}function stats(r){let n=r.issues.filter((_,i)=>isRead(r,i)).length;return{n,t:r.issues.length,p:r.issues.length?Math.round(n/r.issues.length*100):0,next:r.issues.findIndex((_,i)=>!isRead(r,i))}}
function catStats(c){let t=c.runs.reduce((a,r)=>a+r.issues.length,0),n=c.runs.reduce((a,r)=>a+stats(r).n,0),v=c.runs.map(r=>r.rating).filter(x=>x!=null);return{n,t,p:t?Math.round(n/t*100):0,rating:v.length?v.reduce((a,b)=>a+b,0)/v.length:null}}
function go(page,arg){view={page:page,arg:arg};render();scrollTo(0,0)}function toggle(id,i){progress[id+'::'+i]=!progress[id+'::'+i];try{localStorage.setItem(KEY,JSON.stringify(progress))}catch(e){}render()}function isOwned(r,i){return !!owned[r.id+'::'+i]}function toggleOwned(id,i){owned[id+'::'+i]=!owned[id+'::'+i];try{localStorage.setItem(OWNKEY,JSON.stringify(owned))}catch(e){}render()}
function overallStats(){let runs=allRuns(),t=runs.reduce((a,r)=>a+r.issues.length,0),n=runs.reduce((a,r)=>a+stats(r).n,0);return{n,t,remaining:t-n,p:t?Math.round(n/t*100):0}}
function dashboard(){let o=overallStats();return`<section class="hero"><h1>Marvel Reading Dashboard</h1><div class="muted">Browse a character, team, or event. Select a run, mark issues Read or Not Read, and the guide will identify what to read next.</div><div class="overall"><div class="metric"><b>${o.n}</b><span>Comics Read</span></div><div class="metric"><b>${o.remaining}</b><span>Remaining</span></div><div class="metric"><b>${o.p}%</b><span>Total Completed · ${o.n}/${o.t}</span></div></div><div class="bar"><i style="width:${o.p}%"></i></div><input id="search" class="search" placeholder="Search categories and comic runs" oninput="filterCards(this.value)"><div class="mobile-tools"><button onclick="exportProgress()">Download Progress Backup</button><button onclick="document.getElementById('backupFile').click()">Restore Progress Backup</button><input id="backupFile" type="file" accept="application/json,.json" onchange="importProgress(this.files[0]);this.value=''" aria-label="Restore progress backup"></div></section>${groups.map(g=>`<h2 class="group-title">${esc(g.name)}</h2><div class="grid">${g.categories.map(card).join('')}</div>`).join('')}`}
function card(c){let s=catStats(c),q=(c.name+' '+c.runs.map(r=>r.title).join(' ')).toLowerCase();return`<button class="card" data-search="${esc(q)}" onclick="go('category','${esc(c.name)}')"><h3>${esc(c.name)}</h3>${s.rating==null?'<div class="muted">Public rating not loaded</div>':`<div><span class="stars">★</span> ${s.rating.toFixed(2)} / 5</div>`}<div class="bar"><i style="width:${s.p}%"></i></div><div class="summary"><span>${s.n}/${s.t} read</span><b>${s.p}%</b></div></button>`}
function filterCards(q){q=q.toLowerCase();document.querySelectorAll('[data-search]').forEach(x=>x.classList.toggle('hidden',!x.dataset.search.includes(q)))}
function category(name){let c=categories().find(x=>x.name===name),s=catStats(c);return`<section class="hero"><button class="back" onclick="go('dashboard')">← Dashboard</button><h2>${esc(c.name)}</h2>${s.rating==null?'':`<div><span class="stars">★</span> ${s.rating.toFixed(2)} / 5 category average</div>`}<div class="bar"><i style="width:${s.p}%"></i></div><div class="summary"><span>${s.n}/${s.t} read</span><b>${s.p}%</b></div></section><div class="runs">${c.runs.length?c.runs.map(r=>runCard(r)).join(''):'<div class="empty">No reading-order runs are currently listed.</div>'}</div>`}
function runCard(r){let s=stats(r);return`<div class="run" onclick="go('run','${r.id}')"><h3>${esc(r.title)}</h3>${r.rating==null?'':`<div><span class="stars">★</span> ${r.rating.toFixed(2)} / 5</div>`}<div class="bar"><i style="width:${s.p}%"></i></div><div class="summary"><span>${s.n}/${s.t} read</span><b>${s.p}%</b></div></div>`}
function runPage(id){let r=allRuns().find(x=>x.id===id),s=stats(r),n=s.next>=0?r.issues[s.next]:null;return`<section class="hero"><button class="back" onclick="go('category','${esc(r.category)}')">← ${esc(r.category)}</button><h2>${esc(r.title)}</h2>${r.rating==null?'':`<div><span class="stars">★</span> ${r.rating.toFixed(2)} / 5</div>`}<div class="bar"><i style="width:${s.p}%"></i></div><div class="summary"><span>${s.n}/${s.t} read</span><b>${s.p}%</b></div></section>${n?`<div class="next"><b>READ NEXT:</b> ${esc(n.title)}${n.date?' · '+esc(n.date):''}</div>`:r.issues.length?'<div class="next"><b>COMPLETE:</b> Every listed issue is marked read.</div>':''}${r.issues.length?`<div class="headers"><div>#</div><div>Comic</div><div class="date-head">Date</div><div>Status</div><div>Collection</div></div><div class="issues">${r.issues.map((x,i)=>row(r,x,i,s.next)).join('')}</div>`:'<div class="empty">No issue entries are currently listed for this run.</div>'}`}
function row(r,x,i,next){let y=isRead(r,i),o=isOwned(r,i);return`<div class="issue ${y?'read':''} ${i===next?'current':''}"><div>${esc(x.order)}</div><div><b>${esc(x.title)}</b>${i===next?'<div style="color:var(--gold)">READ NEXT</div>':''}</div><div class="date">${esc(x.date||'—')}</div><button class="status" onclick="toggle('${r.id}',${i})">${y?'Read':'Not Read'}</button><button class="owned ${o?'yes':''}" onclick="toggleOwned('${r.id}',${i})">${o?'Own':"Don't Own"}</button></div>`}
function crumbsText(){if(view.page==='dashboard')return'Dashboard';if(view.page==='category')return`<button onclick="go('dashboard')">Dashboard</button> › ${esc(view.arg)}`;let r=allRuns().find(x=>x.id===view.arg);return`<button onclick="go('dashboard')">Dashboard</button> › <button onclick="go('category','${esc(r.category)}')">${esc(r.category)}</button> › ${esc(r.title)}`}
const LIVE_SOURCES={
 'daredevil-2026-present':{query:'Daredevil 2026',match:/^Daredevil \(2026\) #(\d+)$/i}
};
function apiIssueList(d){d=d||{};var dd=d.data||{},c=[d.results,dd.results,d.issues,dd.issues];for(var i=0;i<c.length;i++){if(Array.isArray(c[i]))return c[i]}return [];}

function issueTitle(x){return x.title||x.name||x.issue_title||''}
function issueDate(x){
 const ds=Array.isArray(x.dates)?x.dates:[],hit=ds.find(function(d){return /onsale|release|publish/i.test((d&&d.type)||'')});const raw=x.release_date||x.releaseDate||x.date||x.digital_date||(hit&&hit.date)||'';
 if(!raw)return ''; const d=new Date(raw); if(Number.isNaN(d.getTime()))return String(raw).slice(0,10);
 return String(d.getMonth()+1).padStart(2,'0')+'/'+String(d.getDate()).padStart(2,'0')+'/'+d.getFullYear();
}
async function fetchSeriesIssues(source){
 const u='https://marvel.emreparker.com/v1/search/issues?q='+encodeURIComponent(source.query)+'&limit=100';
 const res=await fetch(u,{cache:'no-store'}); if(!res.ok)throw new Error('Metadata API HTTP '+res.status);
 return apiIssueList(await res.json());
}
async function updateCurrentRuns(){
 const b=document.getElementById('updateRuns'),old=b.textContent;b.disabled=true;b.textContent='↻ Checking releases…';
 try{
  let added=0,checked=0;
  for(const [id,source] of Object.entries(LIVE_SOURCES)){
   const run=allRuns().find(r=>r.id===id); if(!run)continue; checked++;
   const remote=await fetchSeriesIssues(source); const got=[];
   for(const x of remote){const title=issueTitle(x),m=title.match(source.match);if(!m)continue;got.push({num:+m[1],title:'Daredevil (2026) #'+m[1],date:issueDate(x)})}
   got.sort((a,b)=>a.num-b.num); const seen=new Set(run.issues.map(x=>x.title));
   for(const x of got){if(!seen.has(x.title)){run.issues.push({order:run.issues.length+1,title:x.title,date:x.date});seen.add(x.title);added++}}
  }
  render(); b.textContent=added?'✓ Added '+added+' new issue'+(added===1?'':'s'):'✓ Current';
  setTimeout(()=>b.textContent=old,2600);
 }catch(e){console.error(e);b.textContent='Update unavailable';alert('The live comic metadata source could not be reached from this browser. Your saved guide and reading progress were not changed.');setTimeout(()=>b.textContent=old,3200)}finally{b.disabled=false}
}

function exportProgress(){
 const payload={version:1,exportedAt:new Date().toISOString(),progress:progress,owned:owned};
 const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='Marvel_Reading_Guide_Progress.json';
 document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
function importProgress(file){
 if(!file)return;
 const reader=new FileReader();
 reader.onload=function(){
  try{
   const data=JSON.parse(reader.result);
   if(!data||typeof data.progress!=='object'||typeof data.owned!=='object')throw new Error('Invalid backup');
   progress=data.progress;owned=data.owned;
   localStorage.setItem(KEY,JSON.stringify(progress));localStorage.setItem(OWNKEY,JSON.stringify(owned));
   render();alert('Reading and ownership progress restored.');
  }catch(e){alert('That file is not a valid Marvel Reading Guide progress backup.');}
 };
 reader.readAsText(file);
}

function render(){var crumbsEl=document.getElementById('crumbs'),appEl=document.getElementById('app');crumbsEl.innerHTML=crumbsText();appEl.innerHTML=view.page==='dashboard'?dashboard():view.page==='category'?category(view.arg):runPage(view.arg)}render();
</script></body></html>
